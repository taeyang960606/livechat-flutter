name: livechat_flutter
description: Flutter port of the LiveChat Android SDK, with persistent chat, member identity, callbacks and attachments.
version: 1.0.0
publish_to: none
environment:
  sdk: '>=3.11.0 <4.0.0'
  flutter: '>=3.41.0'
dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.13.1
  webview_flutter_android: ^4.10.0
  webview_flutter_wkwebview: ^3.23.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  file_selector: ^1.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  webview_flutter_platform_interface: ^2.14.0
  shared_preferences_platform_interface: ^2.4.1
